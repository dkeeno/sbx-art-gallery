<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="face" cx="55%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#f0d4ae"/>
      <stop offset="60%" stop-color="#a37a4f"/>
      <stop offset="100%" stop-color="#3e2b18"/>
    </radialGradient>
    <linearGradient id="turbanBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%"  stop-color="#1f3a78"/>
      <stop offset="100%" stop-color="#0a1d4a"/>
    </linearGradient>
    <linearGradient id="turbanYellow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%"  stop-color="#e8c14a"/>
      <stop offset="100%" stop-color="#a87f1e"/>
    </linearGradient>
    <radialGradient id="pearl" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cfd6d8"/>
      <stop offset="100%" stop-color="#5b6a72"/>
    </radialGradient>
  </defs>

  <!-- Dark, near-black background — Vermeer's signature void -->
  <rect width="400" height="300" fill="#0a0a0a"/>

  <!-- Shoulder + collar -->
  <path d="M 80 300 Q 110 220 200 210 Q 290 220 320 300 Z" fill="#1a1a1a"/>
  <path d="M 150 235 Q 200 222 250 235 L 240 260 Q 200 248 160 260 Z" fill="#3a342a"/>

  <!-- Face turned slightly (3/4 view) -->
  <path d="M 165 200 Q 155 130 210 120 Q 260 128 252 200 Q 240 240 200 240 Q 175 232 165 200 Z" fill="url(#face)"/>

  <!-- Yellow turban back -->
  <path d="M 175 130 Q 180 80 220 70 Q 270 75 280 130 Q 280 168 268 178 Q 258 156 250 138 Q 245 110 220 110 Q 195 110 192 130 Z" fill="url(#turbanYellow)"/>
  <!-- Blue turban front -->
  <path d="M 170 138 Q 180 95 230 92 Q 268 100 268 145 Q 252 130 232 128 Q 200 128 188 142 Z" fill="url(#turbanBlue)"/>
  <!-- Trailing turban tail -->
  <path d="M 268 140 Q 296 160 304 220 Q 296 230 286 222 Q 282 198 272 178 Z" fill="url(#turbanBlue)"/>

  <!-- Eye + lips (hint, not detail) -->
  <path d="M 200 175 Q 210 172 218 178" stroke="#1a1410" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="208" cy="178" rx="2.4" ry="1.6" fill="#0a0a08"/>
  <path d="M 208 208 Q 215 213 222 208" stroke="#7e3a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- THE pearl -->
  <circle cx="232" cy="218" r="9" fill="url(#pearl)"/>
  <circle cx="229" cy="214" r="2.5" fill="#ffffff" fill-opacity="0.95"/>
  <line x1="232" y1="209" x2="232" y2="200" stroke="#3a342a" stroke-width="0.8"/>
</svg>
